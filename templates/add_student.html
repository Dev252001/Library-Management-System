{% extends "base.html" %}
{% block title %}Register Student — LibraryMS{% endblock %}
{% block topbar_title %}Register Student{% endblock %}

{% block content %}
<div class="pt-3">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-6">

      <a href="{{ url_for('students.list_students') }}"
         class="btn btn-sm btn-outline-secondary mb-3 d-inline-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Back to Students
      </a>

      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom fw-semibold py-3">
          <i class="bi bi-person-plus-fill text-primary me-2"></i>Student Details
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('students.add_student_view') }}">

            <div class="row g-3">
              <div class="col-12">
                <label for="name" class="form-label fw-semibold">
                  Full Name <span class="text-danger">*</span>
                </label>
                <input type="text" id="name" name="name" required
                       class="form-control" placeholder="e.g. Priya Sharma" />
              </div>

              <div class="col-12">
                <label for="contact" class="form-label fw-semibold">
                  Contact <span class="text-muted fw-normal small">(optional)</span>
                </label>
                <input type="text" id="contact" name="contact"
                       class="form-control" placeholder="Phone or email" />
              </div>

              <div class="col-md-6">
                <label for="joining_date" class="form-label fw-semibold">Joining Date</label>
                <input type="date" id="joining_date" name="joining_date"
                       value="{{ today }}" class="form-control" />
              </div>

              <div class="col-md-6">
                <label for="fee_tier" class="form-label fw-semibold">
                  Fee Tier <span class="text-danger">*</span>
                </label>
                <select id="fee_tier" name="fee_tier" class="form-select">
                  <option value="subsidized" selected>Subsidized (reduced rate)</option>
                  <option value="standard">Standard (full rate)</option>
                </select>
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-person-check me-1"></i>Register
              </button>
              <a href="{{ url_for('students.list_students') }}"
                 class="btn btn-outline-secondary">Cancel</a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
