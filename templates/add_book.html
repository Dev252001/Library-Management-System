{% extends "base.html" %}
{% block title %}Add Book — LibraryMS{% endblock %}

{% block content %}
<h1 class="page-title">Add New Book</h1>

<form method="POST" action="{{ url_for('books.add_book_view') }}" class="form-card">

  <div class="form-group">
    <label for="title">Title <span class="required">*</span></label>
    <input type="text" id="title" name="title" required class="input-text"
           placeholder="e.g. The Pragmatic Programmer" />
  </div>

  <div class="form-group">
    <label for="author">Author <span class="required">*</span></label>
    <input type="text" id="author" name="author" required class="input-text"
           placeholder="e.g. Andrew Hunt" />
  </div>

  <div class="form-group">
    <label for="isbn">ISBN <span class="optional">(optional)</span></label>
    <input type="text" id="isbn" name="isbn" class="input-text"
           placeholder="e.g. 978-0-13-468599-1" />
  </div>

  <div class="form-group">
    <label for="category">Category <span class="optional">(optional)</span></label>
    <input type="text" id="category" name="category" class="input-text"
           placeholder="e.g. Computer Science" />
  </div>

  <div class="form-group">
    <label for="total_copies">Number of Copies <span class="required">*</span></label>
    <input type="number" id="total_copies" name="total_copies"
           min="1" value="1" required class="input-text input-narrow" />
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Add to Catalogue</button>
    <a href="{{ url_for('books.list_books') }}" class="btn btn-ghost">Cancel</a>
  </div>

</form>
{% endblock %}
