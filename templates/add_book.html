{% extends "base.html" %}
{% block title %}Add Book — LibraryMS{% endblock %}
{% block topbar_title %}Add New Book{% endblock %}

{% block content %}
<div class="pt-3">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-7">

      <a href="{{ url_for('books.list_books') }}"
         class="btn btn-sm btn-outline-secondary mb-3 d-inline-flex align-items-center gap-1">
        <i class="bi bi-arrow-left"></i> Back to Catalogue
      </a>

      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom fw-semibold py-3">
          <i class="bi bi-journal-plus text-primary me-2"></i>Book Details
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('books.add_book_view') }}">

            <div class="row g-3">
              <div class="col-12">
                <label for="title" class="form-label fw-semibold">
                  Title <span class="text-danger">*</span>
                </label>
                <input type="text" id="title" name="title" required
                       class="form-control"
                       placeholder="e.g. The Pragmatic Programmer" />
              </div>

              <div class="col-12">
                <label for="author" class="form-label fw-semibold">
                  Author <span class="text-danger">*</span>
                </label>
                <input type="text" id="author" name="author" required
                       class="form-control"
                       placeholder="e.g. Andrew Hunt" />
              </div>

              <div class="col-md-7">
                <label for="isbn" class="form-label fw-semibold">
                  ISBN <span class="text-muted fw-normal small">(optional)</span>
                </label>
                <input type="text" id="isbn" name="isbn"
                       class="form-control"
                       placeholder="e.g. 978-0-13-468599-1" />
              </div>

              <div class="col-md-5">
                <label for="total_copies" class="form-label fw-semibold">
                  Copies <span class="text-danger">*</span>
                </label>
                <input type="number" id="total_copies" name="total_copies"
                       min="1" value="1" required class="form-control" />
              </div>

              <div class="col-12">
                <label for="category" class="form-label fw-semibold">
                  Category <span class="text-muted fw-normal small">(optional)</span>
                </label>
                <input type="text" id="category" name="category"
                       class="form-control"
                       placeholder="e.g. Computer Science" />
              </div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-primary px-4">
                <i class="bi bi-check-lg me-1"></i>Add to Catalogue
              </button>
              <a href="{{ url_for('books.list_books') }}"
                 class="btn btn-outline-secondary">Cancel</a>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
